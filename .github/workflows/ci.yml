name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked development dependencies
        if: runner.os != 'Linux'
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Run quality pipeline (make check)
        if: runner.os == 'Linux'
        run: |
          make setup
          make check

      - name: Exercise the native stdio host and geometry
        if: runner.os != 'Linux'
        run: python -m pytest -q tests/test_bootstrap.py tests/test_server.py tests/test_measure.py
