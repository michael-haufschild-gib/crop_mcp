[project]
name = "vision-tools-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pymcp-kit>=0.3,<0.4", "pydantic>=2.14.3,<3", "Pillow>=13.0,<14", "numpy>=2.5.5,<2.6", "packaging"]

[project.scripts]
vision-tools-mcp = "server:main"

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "pytest-cov>=7.1,<8", "mypy>=2.4.1,<3", "ruff>=0.17.5,<0.18"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]
py-modules = ["bootstrap", "file_lock", "server", "stdio_host"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".vision-tools-env"]

[tool.ruff.lint]
select = [
    # Core
    "F",      # pyflakes — unused imports, undefined names, shadowing
    "E",      # pycodestyle errors — whitespace, indentation, syntax style
    "W",      # pycodestyle warnings — trailing whitespace, blank lines

    # Imports
    "I",      # isort — import ordering and grouping
    "TCH",    # flake8-type-checking — move type-only imports behind TYPE_CHECKING

    # Naming
    "N",      # pep8-naming — class, function, variable naming conventions

    # Modernization
    "UP",     # pyupgrade — enforce modern Python syntax for target version

    # Bug prevention
    "B",      # flake8-bugbear — common bugs and design problems
    "A",      # flake8-builtins — shadowing Python builtins
    "PIE",    # flake8-pie — unnecessary code patterns
    "RSE",    # flake8-raise — unnecessary exception parentheses/args
    "RUF",    # ruff-specific — ambiguous characters, unused noqa, mutable defaults

    # Complexity
    "C90",    # mccabe — cyclomatic complexity per function
    "C4",     # flake8-comprehensions — unnecessary list/dict/set comprehension wrappers
    "PLR",    # pylint refactoring — too many statements/branches/args/returns
    "PLE",    # pylint errors — bad string format, invalid all
    "PLW",    # pylint warnings — unreachable code, dangerous defaults

    # Simplification
    "SIM",    # flake8-simplify — collapsible ifs, dict.get, ternaries
    "RET",    # flake8-return — unnecessary else after return, assign-then-return
    "PERF",   # perflint — performance anti-patterns (unnecessary list(), etc.)

    # Code hygiene
    "ERA",    # eradicate — commented-out code
    "T20",    # flake8-print — no print() in library code
    "T10",    # debugger statements
    "PGH",    # blanket noqa and type-check suppressions
    "ARG",    # unused parameters
    "FIX",    # unfinished implementation markers
    "LOG", "G", "DTZ", "ASYNC", "FURB",
    "S101",   # runtime validation must also work under python -O
    "PT",     # pytest assertions, fixtures, parametrization and exception checks

    # Pathlib
    "PTH",    # flake8-use-pathlib — use Path instead of os.path
]

[tool.ruff.lint.per-file-ignores]
# tests: magic values in assertions, runtime Path import, regex match patterns
"tests/*.py" = ["PLR2004", "TC003", "RUF043", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40
max-branches = 10
max-args = 7
max-returns = 6

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
strict = true
markers = ["integration: exercise a complete image pipeline or the real stdio server"]
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pymcp.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.coverage.run]
data_file = ".coverage.vision-tools"
source = ["."]
patch = ["subprocess"]
# Stdio hosts start outside the checkout; these globs also match in child processes.
omit = ["*/tests/*", "*/.vision-tools-env/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = [
    "if __name__",
    "if TYPE_CHECKING",
]
